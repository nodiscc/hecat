steps:
  - name: lint
    module: processors/awesome_lint
    module_options:
      source_directory: tests/awesome-selfhosted-data
      # items_in_redirect_fatal: True
      # last_updated_error_days: 3650 # (optional, default 3650) raise an error message for projects that have not been updated in this number of days
      # last_updated_warn_days: 365 # (optional, default 365) raise a warning message for projects that have not been updated in this number of days
      # last_updated_info_days: 186 # (optional, default 186) raise an info message for projects that have not been updated in this number of days
      licenses_files:
        - licenses.yml
        - licenses-nonfree.yml
      last_updated_skip: # (optional, default []) list of items (source_code_url) for which the last update date check should not produce errors/warnings
        - https://github.com/tomershvueli/homepage # simple/no maintenance required https://github.com/awesome-selfhosted/awesome-selfhosted-data/pull/242
        - https://github.com/abrenaut/posio # simple/no maintenance required
        - https://github.com/knrdl/bicimon # simple/no maintenance required
        - https://github.com/Kshitij-Banerjee/Cubiks-2048 # simple/no maintenance required
      description_rules:
        - regex: '(?i)^(?:a|an|the)\s'
          reason: 'Description must not start with "The", "A", ...'
        - regex: '(?i)^\S+(?:\s+\S+){0,3}\s+is\s+(?:a|an|the)\s'
          reason: 'Description must not be of the form "$PROJECT is a ..."'
        - regex: '(?i)\b(?:open[- ]source|self[- ]hosted|free(?: and)? open|foss|oss)\b'
          reason: 'Avoid redundant terms (open source, self-hosted, free) as their presence on awesome-selfhosted already implies this'
        - regex: '\s{2,}|\s+\.$'
          reason: 'Description must not contain repeated whitespace or a space before the final dot'
        - regex: '\[[^\]]*\]\([^)]*\)'
          reason: 'Description must be plain text, do not use markdown links'
        - regex: '\*\*|__|(?<!\w)[*_][^*_\s][^*_]*[*_](?!\w)|`'
          reason: 'Description must be plain text, do not use markdown formatting'
        - regex: '<[a-zA-Z/][^>]*>'
          reason: 'Description must be plain text, do not use inline HTML'
        - regex: '(?<!\()(?i:alternative to )[A-Z0-9]'
          reason: 'Use the syntax (alternative to $PRODUCT1, $PRODUCT2) at the end of the description'
        - regex: '\((?!alternative to )(?i:alternative to )'
          reason: 'The (alternative to ...) annotation must be lowercase'
        - regex: '(?i:\(alternative to )(?:[^,)]*?(?:,|(?<!,)\sand\s)){3,}'
          reason: 'List at most 3 products in (alternative to ...)'
        - regex: '(?<!\()\b(?i:fork(?:ed)? (?:of|from) )[A-Z0-9]'
          reason: 'Use the syntax (fork of $PROJECT) at the end of the description'
        - regex: '\((?!fork of )(?i:fork(?:ed)? (?:of|from) )'
          reason: 'The fork annotation must be written as lowercase (fork of $PROJECT)'
        - regex: '(?i:\(fork of )[^)]*?(?:,|\sand\s)'
          reason: 'The (fork of ...) annotation must name a single project'
        - regex: '(?<!\()(?i:documentation in |docs in )[A-Z]'
          reason: 'Use the syntax (documentation in $LANGUAGE) at the end of the description'
          severity: warning # may match "Host documentation in Docker containers" and similar
        - regex: '\((?!documentation in )(?i:documentation in |docs in )'
          reason: 'The documentation annotation must be written as lowercase (documentation in $LANGUAGE)'
        - regex: '(?i:\(documentation in )[a-z][a-z ]*\)'
          reason: 'The language in (documentation in $LANGUAGE) must be capitalized'
        - regex: '\.\s*\((?i:alternative to|fork of|documentation in)'
          reason: 'Annotations must be appended to the last sentence, not placed after its final dot'
        - regex: '\((?i:alternative to|fork of|documentation in)(?:[^()]|\([^()]*\))*\)(?!(?:\s*\((?i:alternative to|fork of|documentation in)(?:[^()]|\([^()]*\))*\))*\s*\.?\s*$)'
          reason: 'The (alternative to ...) / (fork of ...) / (documentation in ...) annotation must be at the end of the description'
